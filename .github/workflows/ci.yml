name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI install
        working-directory: ui
        run: npm ci --legacy-peer-deps
      - name: UI typecheck
        working-directory: ui
        run: npx tsc --noEmit
      - name: UI tests
        working-directory: ui
        run: npx vitest run
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # Opt-in smoke run of real community plugin bundles (downloads pinned releases from GitHub).
  real-plugins:
    name: Real plugin bundles
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ui/.cache/real-plugins
          key: real-plugins-${{ hashFiles('ui/scripts/real-plugins.mjs') }}
      - working-directory: ui
        run: npm ci --legacy-peer-deps && npm run test:real-plugins

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI build
        working-directory: ui
        run: npm ci --legacy-peer-deps && npm run build
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test (core)
        run: cargo test -p tachylite-core -p tachylite-plugins
