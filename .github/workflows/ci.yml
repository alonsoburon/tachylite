name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4 # Vitest still runs on Node
        with:
          node-version: 22
      - name: UI install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: UI typecheck
        working-directory: ui
        run: bun run typecheck
      - name: UI tests
        working-directory: ui
        run: bun run test
      - name: UI build
        working-directory: ui
        run: bun run build
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # Opt-in smoke run of real community plugin bundles (downloads pinned releases from GitHub).
  real-plugins:
    name: Real plugin bundles
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4 # Vitest still runs on Node
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ui/.cache/real-plugins
          key: real-plugins-${{ hashFiles('ui/scripts/real-plugins.mjs') }}
      - working-directory: ui
        run: bun install --frozen-lockfile && bun run test:real-plugins

  # Linux packages (.deb, .rpm + AppImage) from main, kept as workflow artifacts. See docs/platform.md.
  bundle-linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf xdg-utils rpm xvfb openbox xdotool xclip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4 # Vitest still runs on Node
        with:
          node-version: 22
      - name: UI build
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build
      - name: tauri build
        working-directory: crates/tachylite-app
        run: bunx @tauri-apps/cli@2 build --bundles deb,rpm,appimage
      - name: Real-window smoke test
        # Launches the release binary on a private X server and drives it with real key presses; see scripts/smoke.sh.
        run: scripts/smoke.sh target/release/tachylite
      - uses: actions/upload-artifact@v4
        with:
          name: tachylite-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4 # Vitest still runs on Node
        with:
          node-version: 22
      - name: UI build
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build
      - name: cargo build
        run: cargo build --workspace --locked
      - name: cargo test (core)
        run: cargo test -p tachylite-core -p tachylite-plugins
      # The same UI gate as on Linux: the tests run the real Rust parser (built by the vitest global setup), so paths,
      # line endings and file names on macOS and Windows are exercised too.
      - name: UI typecheck
        working-directory: ui
        run: bun run typecheck
      - name: UI tests
        working-directory: ui
        run: bun run test
