[package]
name = "tachylite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vault, markdown metadata and link graph engine compatible with the Obsidian vault format"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
walkdir.workspace = true
regex.workspace = true
# MIT/Apache-2.0. Canonical (NFC) form for link matching, so "é" typed as one or two code points finds the same file.
unicode-normalization = "0.1"
notify.workspace = true
# MIT. Moves deleted notes to the OS trash (freedesktop trash, macOS Finder, Windows Recycle Bin).
trash = "5"

[dev-dependencies]
tempfile.workspace = true
