[workspace]
resolver = "2"
members = ["crates/tachylite-core", "crates/tachylite-plugins", "crates/tachylite-cli", "crates/tachylite-app"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/alonsoburon/tachylite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"
regex = "1"
notify = "8"
ureq = "3"
tempfile = "3"
